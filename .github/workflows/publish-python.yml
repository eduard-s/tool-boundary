name: Publish Python

on:
  push:
    tags: ['python-v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Match tag and package version
        working-directory: packages/python
        run: |
          python -c 'import os,tomllib; version=tomllib.load(open("pyproject.toml","rb"))["project"]["version"]; assert os.environ["GITHUB_REF_NAME"] == "python-v" + version'
      - name: Install tools
        working-directory: packages/python
        run: python -m pip install -e '.[dev]'
      - name: Lint and test
        working-directory: packages/python
        run: |
          ruff check .
          pytest -q
      - name: Make distributions
        working-directory: packages/python
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist/
          attestations: false
